```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusCare AI | Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

            background:
                radial-gradient(circle at top left, #dbeafe, transparent 35%),
                radial-gradient(circle at bottom right, #e0e7ff, transparent 35%),
                #f8fafc;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: rgba(255,255,255,0.98);
            padding: 42px 38px;
            border-radius: 24px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 20px 55px rgba(15,23,42,0.12);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            color: #2563eb;
            margin-bottom: 10px;
        }

        .logo span {
            color: #0f172a;
        }

        .icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            border-radius: 18px;
            background: #eff6ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        h2 {
            text-align: center;
            margin: 0 0 8px;
            color: #0f172a;
            font-size: 25px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin: 0 0 30px;
            font-size: 14px;
        }

        label {
            display: block;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 8px;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 11px;
            margin-bottom: 20px;
            font-size: 15px;
            font-family: inherit;
            background: #f8fafc;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            background: white;
            border-color: #2563eb;
            box-shadow: 0 0 0 4px #dbeafe;
        }

        input::placeholder {
            color: #94a3b8;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(37,99,235,0.25);
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(37,99,235,0.32);
        }

        button:active {
            transform: translateY(0);
        }

        .error {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            padding: 11px 13px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #2563eb;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }

        .security-note {
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
            margin-top: 22px;
        }

        @media (max-width: 500px) {
            .login-card {
                padding: 32px 22px;
            }
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="icon">🔐</div>

        <div class="logo">
            CampusCare <span>AI</span>
        </div>

        <h2>Admin Login</h2>

        <p class="subtitle">
            Sign in to access the administrator dashboard
        </p>

        {% if error %}
        <div class="error">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login">

            <label for="username">
                Username
            </label>

            <input
                id="username"
                type="text"
                name="username"
                placeholder="Enter username"
                autocomplete="username"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                id="password"
                type="password"
                name="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required
            >

            <button type="submit">
                Login to Dashboard
            </button>

        </form>

        <a href="/" class="back">
            ← Back to Home
        </a>

        <div class="security-note">
            🔒 Authorized administrator access only
        </div>

    </div>

</body>
</html>
```
